name: App Store Archive Upload

on:
  push:
    tags:
      - "appstore-build-*"
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: "1"

jobs:
  archive-upload:
    name: Archive and Upload to App Store Connect
    runs-on: macos-15

    env:
      APP_SCHEME: FixPilot
      APP_PROJECT: FixPilot.xcodeproj
      APP_BUNDLE_ID: com.fixpilot.app
      APP_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ARCHIVE_PATH: ${{ github.workspace }}/build/FixPilot.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.APPLE_TEAM_ID }}" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          test -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" || (echo "Missing APP_STORE_CONNECT_API_KEY_ID" && exit 1)
          test -n "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" || (echo "Missing APP_STORE_CONNECT_API_ISSUER_ID" && exit 1)
          test -n "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" || (echo "Missing APP_STORE_CONNECT_API_PRIVATE_KEY" && exit 1)

      - name: Resolve build number
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

      - name: Write export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APP_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          mkdir -p build
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APP_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"

      - name: Upload IPA to App Store Connect
        run: |
          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || (echo "IPA not found" && exit 1)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FixPilot-archive-output
          path: |
            build
            ExportOptions.plist
